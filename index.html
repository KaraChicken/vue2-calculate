<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="使用原生 HTML、CSS 與 JavaScript 製作的簡易計算機。">
  <title>JavaScript Calculator</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="calculator" aria-label="JavaScript 計算機">
    <section class="calculator__panel">
      <h1 class="sr-only">JavaScript Calculator</h1>

      <output id="display" class="display" aria-live="polite" aria-label="計算結果">0</output>

      <div class="keys" aria-label="計算機按鍵">
        <button class="key key--function" type="button" data-action="clear">C</button>
        <button class="key key--function" type="button" data-action="backspace" aria-label="刪除最後一位">←</button>
        <button class="key key--operator" type="button" data-operator="divide" aria-label="除">÷</button>
        <button class="key key--operator" type="button" data-operator="multiply" aria-label="乘">×</button>

        <button class="key" type="button" data-number="7">7</button>
        <button class="key" type="button" data-number="8">8</button>
        <button class="key" type="button" data-number="9">9</button>
        <button class="key key--operator" type="button" data-operator="subtract" aria-label="減">−</button>

        <button class="key" type="button" data-number="4">4</button>
        <button class="key" type="button" data-number="5">5</button>
        <button class="key" type="button" data-number="6">6</button>
        <button class="key key--operator" type="button" data-operator="add" aria-label="加">+</button>

        <button class="key" type="button" data-number="1">1</button>
        <button class="key" type="button" data-number="2">2</button>
        <button class="key" type="button" data-number="3">3</button>
        <button class="key key--equals" type="button" data-action="equals" aria-label="等於">=</button>

        <button class="key key--zero" type="button" data-number="0">0</button>
        <button class="key" type="button" data-action="decimal">.</button>
      </div>
    </section>
  </main>

  <script src="./js/calculator.js"></script>
</body>
</html>
